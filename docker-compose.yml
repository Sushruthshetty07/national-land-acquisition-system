version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: land_postgres
    restart: always
    environment:
      POSTGRES_DB: national_land_db
      POSTGRES_USER: land_admin
      POSTGRES_PASSWORD: NationalLandSecretPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U land_admin -d national_land_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: land_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Express Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: land_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://land_admin:NationalLandSecretPassword2026!@postgres:5432/national_land_db
      - USE_POSTGRES=true
      - JWT_SECRET=national-land-acquisition-secret-key-2026
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # 4. React Vite Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: land_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service

volumes:
  pgdata:
